name: Deploy

# Deploys the wallet to Fly.io (fly.toml). Runs when a GitHub release is
# published, or by hand from the Actions tab. The `production` environment
# holds the deploy token (secret FLY_API_TOKEN) and the deployment's own
# values (variables FLY_APP, VITE_WAS_SERVER_URL and WAS_UPSTREAM), which
# replace the placeholders in fly.toml. Pull requests from forks cannot reach
# that environment. Staging deploys from deploy-staging.yml, after CI passes
# on main. See docs/deployment-fly.io.md.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      FLY_APP: ${{ vars.FLY_APP }}
      VITE_WAS_SERVER_URL: ${{ vars.VITE_WAS_SERVER_URL }}
      WAS_UPSTREAM: ${{ vars.WAS_UPSTREAM }}
    steps:
      - name: Check deployment variables
        run: |
          if [ -z "$FLY_APP" ] || [ -z "$VITE_WAS_SERVER_URL" ] || [ -z "$WAS_UPSTREAM" ]; then
            echo "::error::Set the FLY_APP, VITE_WAS_SERVER_URL and WAS_UPSTREAM variables on the production environment."
            exit 1
          fi

      # Full history, so git describe finds the release tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Builds the Dockerfile on Fly's remote builder and rolls the machines
      # one at a time.
      - name: Deploy
        run: >-
          flyctl deploy --remote-only
          --app "$FLY_APP"
          --build-arg "VITE_WAS_SERVER_URL=$VITE_WAS_SERVER_URL"
          --build-arg "APP_VERSION=$(git describe --tags --always --dirty)"
          --env "WAS_UPSTREAM=$WAS_UPSTREAM"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
