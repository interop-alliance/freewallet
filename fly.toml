# Example Fly.io configuration. nginx serves the wallet and proxies the WAS
# server's routes to the server's own Fly app over Flycast, so both share one
# origin. The app name, domain and upstream below are placeholders: each deploy
# workflow replaces them with the FLY_APP, VITE_WAS_SERVER_URL and
# WAS_UPSTREAM variables of its GitHub environment. See
# docs/deployment-fly.io.md.

app = "freewallet"
primary_region = "iad"

[build]
  [build.args]
    # Same origin as this app: the server's routes are proxied.
    VITE_WAS_SERVER_URL = "https://wallet.example.com/spaces/"

[env]
  # The WAS server app's Flycast address. nginx resolves it once at startup.
  WAS_UPSTREAM = "was-teaching-server.flycast:80"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    # Served by nginx itself, so this check does not depend on the server.
    path = "/index.html"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
