<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico"/>
  <link rel="manifest" href="/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Freewallet</title>
  <style>
    /* Initial loading shell — painted instantly, before the app JS parses.
       main.tsx removes #initial-loader once React has mounted. */
    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: #f7f7f7;
      color: #101418;
      font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #initial-loader .initial-loader__brand {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    #initial-loader .initial-loader__spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 3px solid rgba(16, 20, 24, 0.15);
      border-top-color: #1976d2;
      border-radius: 50%;
      animation: initial-loader-spin 0.8s linear infinite;
    }
    @keyframes initial-loader-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: dark) {
      #initial-loader {
        background: #101418;
        color: #f7f7f7;
      }
      #initial-loader .initial-loader__spinner {
        border-color: rgba(247, 247, 247, 0.15);
        border-top-color: #90caf9;
      }
    }
  </style>
</head>
<body>
<div id="root"></div>
<div id="initial-loader">
  <div class="initial-loader__brand">Freewallet</div>
  <div class="initial-loader__spinner"></div>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
